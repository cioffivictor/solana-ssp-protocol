name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust engine (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (incl. doctests)
        run: cargo test

      - name: Smoke-test the CLI on every sample
        run: |
          cargo run --release -- adjudicate samples/cache-coherence.qf
          cargo run --release -- adjudicate --format json samples/migration-strategy.json > report.json
          cargo run --release -- bundle samples/cache-coherence.qf -o bundle.json
          cargo run --release -- verify bundle.json

      - name: Upload the JSON report for the viewer job
        uses: actions/upload-artifact@v4
        with:
          name: report-json
          path: report.json

  viewer:
    name: TypeScript viewer (build, test)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm install --no-audit --no-fund

      - name: Build the viewer
        working-directory: viewer
        run: npm run build

      - name: Run the viewer test suite
        working-directory: viewer
        run: npm test

      - name: Download the engine's JSON report
        uses: actions/download-artifact@v4
        with:
          name: report-json
          path: viewer

      - name: Render the report end-to-end (console + HTML)
        working-directory: viewer
        run: |
          node dist/cli.js --no-color report.json
          node dist/cli.js --html report.json -o council.html
          test -s council.html && echo "HTML rendered ($(wc -c < council.html) bytes)"
