name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust engine (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (incl. doctests)
        run: cargo test

      - name: Smoke-test the CLI on every sample
        run: |
          cargo run --release -- adjudicate samples/cache-coherence.qf
          cargo run --release -- adjudicate --format json samples/migration-strategy.json > report.json
          cargo run --release -- bundle samples/cache-coherence.qf -o bundle.json
          cargo run --release -- verify bundle.json

      - name: Upload the JSON report for the viewer job
        uses: actions/upload-artifact@v4
        with:
          name: report-json
          path: report.json

  viewer:
    name: TypeScript viewer (build, test)
    runs-on: ubuntu-latest
    needs: rust
    steps:
