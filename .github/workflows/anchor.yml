name: anchor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the risk kernel
        run: cargo build --release
      - name: Build the on-chain program
        run: cargo build -p ssp-registry
