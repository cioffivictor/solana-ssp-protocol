name: anchor

on:
  push:
    paths: ["programs/**", "Anchor.toml", ".github/workflows/anchor.yml"]
  pull_request:
    paths: ["programs/**", "Anchor.toml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo build -p ssp-registry
