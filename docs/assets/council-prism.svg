<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">QuorumForge council prism</title>
  <desc id="desc">A beam of mixed evidence enters a prism and refracts into four verdict bands: consensus, split, contested, and unsupported.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f33"/>
      <stop offset="1" stop-color="#07040f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#cdbbff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- drifting star field -->
  <g fill="#cdbbff" opacity="0.5">
    <circle cx="70" cy="60" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="40" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="300" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="320" r="1.1"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- incoming mixed beam -->
  <line x1="0" y1="180" x2="270" y2="180" stroke="url(#beam)" stroke-width="10" filter="url(#glow)">
    <animate attributeName="stroke-width" values="8;12;8" dur="3s" repeatCount="indefinite"/>
  </line>
  <text x="20" y="165" fill="#b6aee0" font-family="monospace" font-size="12">mixed evidence</text>

  <!-- the prism -->
  <g filter="url(#glow)">
    <polygon points="300,110 360,180 300,250" fill="#7c5cff" fill-opacity="0.18" stroke="#cdbbff" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" values="-2 330 180; 2 330 180; -2 330 180" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="330" cy="180" r="26" fill="url(#core)">
      <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- four refracted verdict bands -->
  <g stroke-width="4" filter="url(#glow)">
    <line x1="345" y1="172" x2="620" y2="120" stroke="#25d0c0">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </line>
    <line x1="345" y1="177" x2="620" y2="163" stroke="#ffd166">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.9s" repeatCount="indefinite"/>
    </line>
    <line x1="345" y1="183" x2="620" y2="208" stroke="#ff5470">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.3s" repeatCount="indefinite"/>
    </line>
    <line x1="345" y1="189" x2="620" y2="255" stroke="#7d8799">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- travelling photons along each band -->
  <g>
    <circle r="3.5" fill="#25d0c0"><animateMotion path="M345,172 L620,120" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#ffd166"><animateMotion path="M345,177 L620,163" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#ff5470"><animateMotion path="M345,183 L620,208" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#7d8799"><animateMotion path="M345,189 L620,255" dur="3.3s" repeatCount="indefinite"/></circle>
