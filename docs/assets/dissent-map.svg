<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t2 d2">
  <title id="t2">QuorumForge dissent map</title>
  <desc id="d2">A ring of agents around a central claim. Green threads pulse toward supporters, red threads toward dissenters, and the central orb tilts by the net polarity.</desc>
  <defs>
    <radialGradient id="bg2" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#08050f"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2a1d66"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg2)"/>

  <!-- concentric consensus rings -->
  <g fill="none" stroke="#cdbbff" stroke-opacity="0.12">
    <circle cx="320" cy="180" r="60"/>
    <circle cx="320" cy="180" r="110"/>
    <circle cx="320" cy="180" r="150">
      <animate attributeName="stroke-opacity" values="0.05;0.2;0.05" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- support threads (green) -->
  <g stroke="#25d0c0" stroke-width="2" filter="url(#soft)">
    <line x1="320" y1="180" x2="470" y2="70"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="320" y1="180" x2="500" y2="180"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="320" y1="180" x2="450" y2="300"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- dissent threads (red) -->
  <g stroke="#ff5470" stroke-width="2" filter="url(#soft)">
    <line x1="320" y1="180" x2="170" y2="70"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="320" y1="180" x2="140" y2="200"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.9s" repeatCount="indefinite"/></line>
  </g>

  <!-- abstaining thread (grey, faint) -->
  <line x1="320" y1="180" x2="250" y2="320" stroke="#7d8799" stroke-width="1.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- pulses travelling inward from agents to the claim -->
  <g>
    <circle r="3" fill="#25d0c0"><animateMotion path="M470,70 L320,180" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#25d0c0"><animateMotion path="M500,180 L320,180" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#ff5470"><animateMotion path="M170,70 L320,180" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#ff5470"><animateMotion path="M140,200 L320,180" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- central claim orb, tilting by net polarity -->
  <g filter="url(#soft)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 320 180; 6 320 180; -6 320 180" dur="5s" repeatCount="indefinite"/>
      <circle cx="320" cy="180" r="34" fill="url(#orb)"/>
      <text x="320" y="185" text-anchor="middle" fill="#0b0616" font-family="monospace" font-size="13" font-weight="bold">claim</text>
