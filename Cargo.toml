[package]
name = "solana-stability-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "SSP risk kernel: turn liquidity-agent attestations into deterministic liquidity regimes for Solana memecoin pools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/cioffivictor/solana-stability-protocol"
keywords = ["solana", "liquidity", "defi", "risk", "deterministic"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

# The kernel stays deliberately dependency-free: parser, codec, adjudicator and
# CLI are std-only so a regime is reproducible on any toolchain. The on-chain
# program under programs/ is a separate crate and the only place anchor-lang
# appears.

[workspace]
members = ["programs/ssp-registry"]
default-members = ["."]

[lib]
name = "ssp"
path = "src/lib.rs"

[[bin]]
name = "ssp"
path = "src/bin/ssp.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
